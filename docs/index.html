<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System | Live Demo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Student Management System</h1>
    </header>

    <div class="demo-note">
        <strong>Live demo:</strong> changes are saved only in your browser. The full version uses Python (Flask) and MySQL.
        <a href="https://github.com/mohammedaarish42-jpg/student-management-system">View the code on GitHub</a>
        <button type="button" id="reset-btn" class="secondary">Reset demo</button>
    </div>

    <main>
        <section class="card">
            <h2 id="form-title">Add Student</h2>
            <form id="student-form">
                <input type="hidden" id="student-id">
                <input type="text" id="name" placeholder="Full name" required>
                <input type="email" id="email" placeholder="Email" required>
                <input type="text" id="course" placeholder="Course" required>
                <input type="number" id="age" placeholder="Age" min="1" required>
                <div class="buttons">
                    <button type="submit" id="submit-btn">Add Student</button>
                    <button type="button" id="cancel-btn" class="secondary" hidden>Cancel</button>
                </div>
            </form>
        </section>

        <section class="card">
            <div class="list-header">
                <h2>Students</h2>
                <input type="text" id="search" placeholder="Search...">
            </div>
            <table>
                <thead>
                    <tr><th>ID</th><th>Name</th><th>Email</th><th>Course</th><th>Age</th><th>Actions</th></tr>
                </thead>
                <tbody id="student-table"></tbody>
            </table>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
